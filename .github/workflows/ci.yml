name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # typecheck + lint + format + seed check + unit/integration tests + build
      - run: npm run check

      # Migrations, RLS and RBAC tests on the runner's preinstalled PostgreSQL (no Docker/Supabase needed)
      - run: npm run test:db

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
