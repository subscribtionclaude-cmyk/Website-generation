<!doctype html>
<!--
  Sign-in / sign-up email: a 6-digit code only, no sign-in link (the site's email form verifies the
  code with verifyOtp). Used locally through supabase/config.toml; hosted projects paste this into
  Dashboard → Authentication → Emails → "Magic link" and "Confirm signup".
-->
<html lang="ar" dir="rtl">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f6f6f7;
      font-family: Arial, sans-serif;
      color: #0b0b0c;
    "
  >
    <div
      style="
        max-width: 420px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 24px;
        text-align: center;
      "
    >
      <p style="margin: 0 0 8px; font-size: 16px; font-weight: bold">MALEK STORE</p>
      <p style="margin: 0 0 16px; font-size: 15px">كود الدخول بتاعك:</p>
      <p
        dir="ltr"
        style="margin: 0 0 16px; font-size: 32px; font-weight: bold; letter-spacing: 8px"
      >
        {{ .Token }}
      </p>
      <p style="margin: 0 0 4px; font-size: 13px; color: #55565c">
        اكتب الكود ده في صفحة الدخول. متشاركهوش مع حد.
      </p>
      <p dir="ltr" style="margin: 16px 0 0; font-size: 13px; color: #55565c">
        Your MALEK STORE sign-in code is shown above. Enter it on the sign-in page and do not share
        it.
      </p>
    </div>
  </body>
</html>
